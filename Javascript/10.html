<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <style>
        body{
            padding: 0%;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(255, 255, 255);
            font-size: 32px;
            background-color: rgb(41, 41, 134);
            
        }
        button{
            padding: 30px;
            border: none;
            background-color: rgb(54, 50, 50);
            color: white;
            
            border-radius: 5px;
        }
        .showcalculation{
            background-color: rgb(77, 70, 70);
            height: 20vh;
            border-radius: 20px;
            padding: 0px 15px;
        }
        .Operations{
            gap: 3px;
            height: 80vh;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
           
        
        }
        .Calculator{
            gap: 10px;
            padding: 30px 15px;
            background-color: rgb(29, 26, 26);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            height: 50vh;
            width: 50vh;

        }
    </style>
  </head>
  <body>
    <div class="Calculator">

    

<div class="showcalculation"><p class="showCalculation"></p></div>


    
        <div class="Operations">

      <button onclick="
        calculation = '';
        console.log(calculation);
        showCalculation()
      ">Clear</button>

<button onclick="
        updateCalculation('(');
      ">(</button>
      <button onclick="
        updateCalculation(')');
      ">)</button>      
    
    
    <button onclick="
        updateCalculation(' + ');
      ">+</button>
    

    
      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    


 
      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    

    




      <button onclick="
        // Note: eval() takes a string and runs it as code.
        // Avoid using eval() in real world projects since
        // it can potentially be given harmful code to run.
        // Only use eval() for learning purposes.

       const before = calculation



        calculation = eval(calculation);
        console.log(calculation)
            
        let  message = document.querySelector('.showCalculation')

        message.innerHTML = `${before} = ${calculation}`  
     
        calculation = '';
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>

      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>
   
          <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

            <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>
      <button onclick="
        updateCalculation('0');
      ">0</button>
      <button onclick="
        updateCalculation('.');
      ">.</button>
            
            

</div>     
</div>
    <script>
        
      let calculation =  localStorage.getItem('calculation') || '';
       
      if (calculation != ""){
showCalculation()

        } 
 
      /*    if(!calculation){
        calculation=''
      } */

      function updateCalculation(value) {
        calculation += value;
        console.log(calculation);


        localStorage.setItem('calculation', calculation)
showCalculation()
      }
      function showCalculation(){
        const message = document.querySelector(".showCalculation")

        message.innerHTML = calculation        
      }
    </script>
  </body>
</html>
