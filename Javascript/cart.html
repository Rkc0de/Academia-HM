<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body>
    <button onclick="cart(1)">Adicionar no carrinho</button>
    <button onclick="cart(-carrinho)">Reset</button>
    <button onclick="cart(2)">+2</button>
    <button onclick="cart(-1)">Remover no carrinho</button>
    

    <p id="carttotal">Carrinho:0</p>






    <script>

  let carrinho=0  

        function cart(A){
            
            carrinho+=A
            

        let carttotal = document.body.querySelector("#carttotal")

        carttotal.textContent = "Carrinho:" + carrinho +"";

        if (carrinho <= 0){

            carrinho++;
        }
  
        }
       
        function result(){
            return 10000

        }

        let calculate=result()
        console.log(calculate)

    </script>
</body>
</html>
